# Adds a new SSH key for a designated root user.
---
- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    state: present
    create_home: yes
    password: $6$pVfcNyAjtytjGRXA$gKN8WRgMH14ELcFof8eVWCsPUZikj7vlBQcYHqqkY5GW5cF7wCBhoUih8h6l/UkQ9RFPfB985uf3k1DW1BL37/  # Required for SSH key auth on Alpine

- name: Add admin to sudoers
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    regexp: '^{{ admin_user }}'
    line: '{{ admin_user }} ALL=(ALL) NOPASSWD: ALL'
    state: present
    validate: 'visudo -cf %s'

- name: Create .ssh directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: Add SSH key for admin user
  ansible.builtin.copy:
    src: ssh_pubkey.pub
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    owner: "{{ admin_user }}" 
    group: "{{ admin_user }}"
    mode: '0600'

- name: Does bash exist?
  ansible.builtin.stat:
    path: /bin/bash
  register: bash_exists

- name: Change to bash shell
  ansible.builtin.user:
    name: '{{ admin_user }}'
    shell: /bin/bash
  when: bash_exists